name: Build NOVA Scrob

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout NOVA Scrob build repo
        uses: actions/checkout@v7

      - name: Load NOVA Scrob metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source nova-scrob.properties
          set +a

          for name in APP_VERSION APP_ID NOVA_TAG NOVA_BASE_VERSION NOVA_MANIFEST; do
            value="${!name}"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "nova_tag=$NOVA_TAG" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            EXPECTED_TAG="v${APP_VERSION}"
            if [[ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]]; then
              echo "Tag/version mismatch: ref=$GITHUB_REF_NAME expected=$EXPECTED_TAG" >&2
              exit 1
            fi
          fi

          {
            echo "### NOVA Scrob build metadata"
            echo "- Fork: v$APP_VERSION"
            echo "- NOVA release: $NOVA_TAG"
            echo "- Manifest: $NOVA_MANIFEST"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate patcher boundary checks
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/tests/test_verify_player_boundary.py
          python3 scripts/tests/test_scrob_auth_architecture.py
          python3 scripts/tests/test_scrob_transport_failure_contract.py
          python3 scripts/tests/test_patch_surface_contract.py
          python3 scripts/tests/test_upstream_feature_boundary.py
          python3 scripts/tests/test_upstream_proposal_bundle.py
          python3 scripts/tests/test_release_hardening.py

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate playback lifecycle regression harness
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/tests/run_playback_lifecycle_tests.sh

      - name: Fetch and lock NOVA release source
        shell: bash
        run: |
          set -euxo pipefail
          LOCK_DIR="$GITHUB_WORKSPACE/dist" \
            bash scripts/fetch_nova_source.sh "$GITHUB_WORKSPACE/nova-src"

          AVP_SHA="$(git -C nova-src/AVP rev-parse HEAD)"
          VIDEO_SHA="$(git -C nova-src/Video rev-parse HEAD)"
          MEDIALIB_SHA="$(git -C nova-src/MediaLib rev-parse HEAD)"
          FILECORE_SHA="$(git -C nova-src/FileCoreLibrary rev-parse HEAD)"

          {
            echo
            echo "### Resolved upstream source"
            echo "- Upstream release manifest: \`releases/download/${NOVA_TAG}/manifest.xml\`"
            echo "- AVP project: \`${AVP_SHA}\`"
            echo "- Video: \`${VIDEO_SHA}\`"
            echo "- MediaLib: \`${MEDIALIB_SHA}\`"
            echo "- FileCoreLibrary: \`${FILECORE_SHA}\`"
            echo "- Full immutable manifest: \`UPSTREAM_LOCK.xml\` build artifact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight portable Scrob feature
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/apply_nova_scrob.py --check --feature-only --surface-report dist/UPSTREAM_FEATURE_SURFACE.md nova-src
          grep -F 'Mode: **portable Scrob feature only**' dist/UPSTREAM_FEATURE_SURFACE.md
          grep -F '`PlayerActivity.java` anchor replacements: **6**' dist/UPSTREAM_FEATURE_SURFACE.md
          grep -F 'Fork-overlay operations: **0**' dist/UPSTREAM_FEATURE_SURFACE.md
          cat dist/UPSTREAM_FEATURE_SURFACE.md >> "$GITHUB_STEP_SUMMARY"

      - name: Preflight complete NOVA Scrob fork
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/apply_nova_scrob.py --check --surface-report dist/PATCH_SURFACE.md nova-src
          grep -F 'Mode: **complete NOVA Scrob fork**' dist/PATCH_SURFACE.md
          grep -F '`PlayerActivity.java` anchor replacements: **7**' dist/PATCH_SURFACE.md
          cat dist/PATCH_SURFACE.md >> "$GITHUB_STEP_SUMMARY"

      - name: Generate upstream proposal bundle
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf nova-feature-src dist/upstream-proposal
          cp -a nova-src nova-feature-src
          python3 scripts/apply_nova_scrob.py --feature-only nova-feature-src
          python3 scripts/generate_upstream_proposal_bundle.py \
            nova-src nova-feature-src dist/upstream-proposal \
            --surface-report dist/UPSTREAM_FEATURE_SURFACE.md
          grep -F 'custom Back button' dist/upstream-proposal/PROPOSAL_DRAFT.md
          ! grep -q 'org.courville.novascrob' dist/upstream-proposal/UPSTREAM_FEATURE.patch
          ! grep -q 'scrob_back_menu' dist/upstream-proposal/UPSTREAM_FEATURE.patch
          tar -czf "dist/nova-scrob-v${APP_VERSION}-upstream-proposal.tar.gz" -C dist/upstream-proposal .
          rm -rf nova-feature-src

      - name: Apply NOVA Scrob patch
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/apply_nova_scrob.py nova-src
          grep -R "${APP_ID}" -n nova-src/Video/build.gradle nova-src/Video/AndroidManifest.xml
          grep -R "scrob_login\|scrob_enabled" -n nova-src/Video/res/xml/preferences_video.xml
          test -f nova-src/Video/src/main/java/com/archos/mediacenter/video/scrob/ScrobLoginPreference.java
          test -f nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/ScrobConfig.java
          test -f nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/ScrobCredentials.java
          test -f nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/ScrobConnectionState.java
          test -f nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/ScrobConnectionCheck.java
          test -f nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/ScrobConnection.java
          test -f nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/ScrobAuthManager.java
          grep -n 'KEY_URL = "scrob_url"' nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/ScrobConfig.java
          grep -n 'KEY_API_KEY = "scrob_api_key"' nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/ScrobCredentials.java
          grep -n "ScrobAuthManager.getConnection" nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/Scrob.java
          grep -n "class ScrobLoginPreference" nova-src/Video/src/main/java/com/archos/mediacenter/video/scrob/ScrobLoginPreference.java
          grep -n "ScrobAuthManager.getConnection(ctx)" nova-src/Video/src/main/java/com/archos/mediacenter/video/scrob/ScrobLoginPreference.java
          grep -n "ScrobAuthManager.getApiKeyForEditing(ctx)" nova-src/Video/src/main/java/com/archos/mediacenter/video/scrob/ScrobLoginPreference.java
          grep -n "ScrobAuthManager.saveApiKeyConnection(ctx,u,k)" nova-src/Video/src/main/java/com/archos/mediacenter/video/scrob/ScrobLoginPreference.java
          grep -n "ScrobAuthManager.recordConnectionCheck(ctx,check)" nova-src/Video/src/main/java/com/archos/mediacenter/video/scrob/ScrobLoginPreference.java
          grep -n 'TESTING("Testing")' nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/ScrobConnectionState.java
          grep -n 'AUTHENTICATION_FAILED("Authentication failed")' nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/ScrobConnectionState.java
          grep -n 'SERVER_UNREACHABLE("Server unreachable")' nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/ScrobConnectionState.java
          grep -n 'SERVER_API_INCOMPATIBLE("Server/API incompatible")' nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/ScrobConnectionState.java
          grep -n "Connection state:" nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/Scrob.java
          grep -n "Authentication:" nova-src/MediaLib/src/com/archos/mediacenter/utils/scrob/Scrob.java
          ! grep -q "Scrob\.baseUrl(\|Scrob\.apiKey(\|Scrob\.hasConnection(\|Scrob\.status(\|Scrob\.saveConnection(\|Scrob\.disconnect(" nova-src/Video/src/main/java/com/archos/mediacenter/video/scrob/ScrobLoginPreference.java
          test -f nova-src/Video/src/main/java/com/archos/mediacenter/video/scrob/ScrobPlaybackBridge.java
          grep -n "mScrobPlayback.onPlay" nova-src/Video/src/main/java/com/archos/mediacenter/video/player/PlayerActivity.java
          grep -n "PROGRESS_INTERVAL_MS = 60000L" nova-src/Video/src/main/java/com/archos/mediacenter/video/scrob/ScrobPlaybackBridge.java
          grep -n "getPlaybackSnapshot()" nova-src/Video/src/main/java/com/archos/mediacenter/video/scrob/ScrobPlaybackBridge.java
          ! grep -q "mScrobHandler\|mScrobProgress\|private void scrobPlayback" nova-src/Video/src/main/java/com/archos/mediacenter/video/player/PlayerActivity.java
          grep -n "R.id.scrob_back_menu" nova-src/Video/src/main/java/com/archos/mediacenter/video/player/PlayerActivity.java
          grep -n "backMenuItem.setOnMenuItemClickListener" nova-src/Video/src/main/java/com/archos/mediacenter/video/player/PlayerActivity.java
          ! grep -q "if (item.getItemId() == R.id.scrob_back_menu)" nova-src/Video/src/main/java/com/archos/mediacenter/video/player/PlayerActivity.java
          ! grep -q "MENU_BACK_ID" nova-src/Video/src/main/java/com/archos/mediacenter/video/player/PlayerActivity.java
          ! grep -q "import com.archos.mediacenter.video.scrob.ScrobPlaybackBridge;" nova-src/Video/src/main/java/com/archos/mediacenter/video/player/PlayerActivity.java
          test -f nova-src/Video/res/values/scrob_ids.xml
          test -f nova-src/Video/src/main/java/com/archos/mediacenter/video/scrob/ScrobDiagnosticsPreference.java
          test -f nova-src/Video/res/drawable/ic_nova_scrob_back.xml
          grep -n "scrob_diagnostics" nova-src/Video/res/xml/preferences_video.xml
          grep -F "applicationId = \"${APP_ID}\"" nova-src/Video/build.gradle
          grep -n "NOVA Scrob" nova-src/Video/AndroidManifest.xml
          grep -F "NOVA Scrob: v${APP_VERSION}" nova-src/Video/src/main/java/com/archos/mediacenter/video/scrob/ScrobDiagnosticsPreference.java
          grep -F "Base NOVA: v${NOVA_BASE_VERSION}" nova-src/Video/src/main/java/com/archos/mediacenter/video/scrob/ScrobDiagnosticsPreference.java
          test -f nova-src/Video/res/mipmap-nodpi/nova_scrob_icon.png
          test -f nova-src/Video/res/mipmap-anydpi-v26/nova_scrob_icon.xml

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euxo pipefail
          cd nova-src/Video
          chmod +x ./gradlew
          ./gradlew --no-daemon -Puniversal assembleNoamazonRelease

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          base64 --decode signing/nova-scrob.jks.b64 > dist/nova-scrob.jks

          APK="$(find nova-src/Video/build/outputs/apk -type f -name '*.apk' | grep -Ei 'noamazon.*release|release.*noamazon' | head -1)"
          if [ -z "$APK" ]; then
            echo "Could not locate release APK"
            find nova-src/Video/build/outputs -type f || true
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks dist/nova-scrob.jks \
            --ks-key-alias nova-scrob \
            --ks-pass pass:nova-scrob-local \
            --key-pass pass:nova-scrob-local \
            --out "dist/nova-scrob-v${APP_VERSION}.apk" \
            "$APK"

          "$APKSIGNER" verify --verbose --print-certs "dist/nova-scrob-v${APP_VERSION}.apk"

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          if [ -z "$AAPT" ]; then
            echo "aapt not found"
            exit 1
          fi
          "$AAPT" dump badging "dist/nova-scrob-v${APP_VERSION}.apk" | tee dist/APK_BADGING.txt
          grep -F "package: name='${APP_ID}'" dist/APK_BADGING.txt
          grep -F "versionName='${NOVA_BASE_VERSION}'" dist/APK_BADGING.txt
          grep -F "application-label:'NOVA Scrob'" dist/APK_BADGING.txt
          grep -F "application: label='NOVA Scrob' icon='" dist/APK_BADGING.txt

          sha256sum dist/nova-scrob.jks > dist/SIGNING_KEY.sha256
          rm -f dist/nova-scrob.jks
          sha256sum "dist/nova-scrob-v${APP_VERSION}.apk" > dist/SHA256SUMS.txt
          sha256sum "dist/nova-scrob-v${APP_VERSION}-upstream-proposal.tar.gz" >> dist/SHA256SUMS.txt

          cp release/RELEASE_CANDIDATE_CHECKLIST.md dist/RELEASE_CANDIDATE_CHECKLIST.md
          cp release/RC1_RELEASE_NOTES.md dist/RC1_RELEASE_NOTES.md
          {
            echo "# NOVA Scrob release provenance"
            echo
            echo "- Fork version: \`v${APP_VERSION}\`"
            echo "- Repository commit: \`${GITHUB_SHA}\`"
            echo "- Package: \`${APP_ID}\`"
            echo "- NOVA release: \`${NOVA_TAG}\`"
            echo "- NOVA base versionName: \`${NOVA_BASE_VERSION}\`"
            echo "- Upstream lock SHA-256: \`$(cut -d' ' -f1 dist/UPSTREAM_LOCK.sha256)\`"
            echo "- APK SHA-256: \`$(sha256sum "dist/nova-scrob-v${APP_VERSION}.apk" | cut -d' ' -f1)\`"
            echo "- Signing-key SHA-256: \`$(cut -d' ' -f1 dist/SIGNING_KEY.sha256)\`"
            echo "- Portable PlayerActivity anchors: **6**"
            echo "- Complete-fork PlayerActivity anchors: **7**"
          } > dist/RELEASE_PROVENANCE.md
          cat dist/RELEASE_PROVENANCE.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK and release evidence
        uses: actions/upload-artifact@v7
        with:
          name: nova-scrob-v${{ steps.meta.outputs.app_version }}-apk
          path: |
            dist/nova-scrob-v${{ steps.meta.outputs.app_version }}.apk
            dist/SHA256SUMS.txt
            dist/APK_BADGING.txt
            dist/UPSTREAM_LOCK.xml
            dist/UPSTREAM_LOCK.txt
            dist/UPSTREAM_LOCK.sha256
            dist/PATCH_SURFACE.md
            dist/UPSTREAM_FEATURE_SURFACE.md
            dist/RELEASE_PROVENANCE.md
            dist/SIGNING_KEY.sha256
            dist/RELEASE_CANDIDATE_CHECKLIST.md
            dist/RC1_RELEASE_NOTES.md
            dist/nova-scrob-v${{ steps.meta.outputs.app_version }}-upstream-proposal.tar.gz
            dist/upstream-proposal/**
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nova-scrob-v${{ steps.meta.outputs.app_version }}.apk
            dist/SHA256SUMS.txt
            dist/APK_BADGING.txt
            dist/UPSTREAM_LOCK.xml
            dist/UPSTREAM_LOCK.txt
            dist/UPSTREAM_LOCK.sha256
            dist/PATCH_SURFACE.md
            dist/UPSTREAM_FEATURE_SURFACE.md
            dist/RELEASE_PROVENANCE.md
            dist/SIGNING_KEY.sha256
            dist/RELEASE_CANDIDATE_CHECKLIST.md
            dist/RC1_RELEASE_NOTES.md
            dist/nova-scrob-v${{ steps.meta.outputs.app_version }}-upstream-proposal.tar.gz
          generate_release_notes: true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nova-scrob-v${{ steps.meta.outputs.app_version }}-diagnostics
          path: |
            dist/UPSTREAM_LOCK.xml
            dist/UPSTREAM_LOCK.txt
            dist/UPSTREAM_LOCK.sha256
            dist/PATCH_SURFACE.md
            dist/UPSTREAM_FEATURE_SURFACE.md
            dist/RELEASE_PROVENANCE.md
            dist/upstream-proposal/**
            nova-src/Video/build/reports/**
            nova-src/Video/build/outputs/logs/**
            nova-src/Video/build.gradle
            nova-src/Video/AndroidManifest.xml
            nova-src/Video/res/xml/preferences_video.xml
          if-no-files-found: ignore
